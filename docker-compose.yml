services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Host ports for the datastores are bound to 127.0.0.1: reachable from this
    # machine (host-side tools, pytest), not from the network. A bare "5433:5432"
    # listens on every interface. Containers never use these — they talk over
    # the Compose network by service name (postgres:5432, redis:6379, ...).
    ports:
      # Host 5433 because a native PostgreSQL service already owns 5432 on this
      # machine. Inside the Compose network the port is still 5432.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management
    # Required for the volume below to mean anything. RabbitMQ names its node
    # rabbit@<hostname> and keeps its data under mnesia/rabbit@<hostname>. A
    # container's hostname defaults to its container ID, which changes on every
    # recreate — so without this, each new container boots as a NEW node and
    # starts an empty broker next to the old node's data, still on the volume
    # but never read. Verified: the volume held both rabbit@35a1d3d3a415 (with
    # the messages) and rabbit@20405d1f4820 (empty, the one running).
    hostname: rabbitmq
    ports:
      - "127.0.0.1:5672:5672"   # AMQP protocol port
      - "127.0.0.1:15672:15672" # management UI (http://localhost:15672, guest/guest)
    volumes:
      # Named, not left to the image's own VOLUME. The image declares
      # /var/lib/rabbitmq as a volume, so without this Docker creates an
      # anonymous one — and a recreated container gets a new, empty anonymous
      # volume. Durable queues and persistent messages then survive a restart
      # but not `docker compose down` + `up`, which discards every queued
      # message. A QUEUED job whose message is lost that way is stranded.
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      # NOT `ping`. ping reports success as soon as the Erlang node is up, which
      # happens ~50s before the AMQP listener accepts connections on this
      # machine — a worker started on that false positive dies immediately with
      # IncompatibleProtocolError. check_port_connectivity tests the listener.
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 30s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      target: api
    env_file: .env
    environment:
      # Must be set explicitly. storage_dir defaults to ROOT_DIR/"storage",
      # and ROOT_DIR is computed from config.py's location — which resolves to
      # "/" inside the image, giving "/storage". That is NOT where the volume
      # is mounted, so the default would write generated files to a path that
      # disappears on restart.
      STORAGE_DIR: /app/storage
      # Uvicorn processes (uvicorn reads this as its --workers default). One
      # Python process saturates at ~77 req/s on the GIL (Phase 17). Each
      # process has its own 15-connection pool and its own in-flight cap of 15,
      # so the budget is 15 × this against Postgres's max_connections of 100,
      # shared with the worker and reaper.
      WEB_CONCURRENCY: "2"
    ports:
      - "8000:8000"
    volumes:
      - job_storage:/app/storage
    depends_on:
      # `condition: service_healthy`, not bare depends_on — plain depends_on
      # waits for the container to start, not for the service inside it to be
      # ready to accept connections.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      target: worker
    env_file: .env
    environment:
      STORAGE_DIR: /app/storage
    volumes:
      # Same named volume, same path as the API: the worker writes a PDF here
      # and the API reads the identical file. Two containers writing to the
      # same path WITHOUT a shared volume would be two isolated filesystems.
      - job_storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  reaper:
    # Same image as the worker — identical dependencies, different entrypoint.
    # It must be a separate process: a crashed worker cannot detect its own
    # crash. Safe to scale, since its requeue is a conditional UPDATE that only
    # one reaper can win.
    build:
      context: ./backend
      target: worker
    command: ["python", "-m", "worker.reaper"]
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      # Healthy only while this reaper keeps completing scans. The restart
      # policy catches a reaper that exits; this catches one that is running
      # but hung or failing every scan, which would otherwise stop crash
      # recovery with nothing to show for it.
      test: ["CMD", "python", "-c", "import socket, sys; from app.redis_client import redis_client as r; sys.exit(0 if r.exists('reaper:last_scan:' + socket.gethostname()) else 1)"]
      interval: 15s
      timeout: 5s
      retries: 2
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_data:
  job_storage:
  rabbitmq_data:
