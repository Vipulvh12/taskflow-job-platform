# Lint for bugs, not style: pyflakes (F: undefined names, unused imports and
# variables, redefinitions) and pycodestyle's error-level checks (E4/E7/E9:
# import placement, statement mistakes, syntax errors). Selected explicitly so
# a ruff upgrade that changes its defaults can't change what CI enforces.
target-version = "py311"

[lint]
select = ["E4", "E7", "E9", "F"]
