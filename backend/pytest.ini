[pytest]
testpaths = tests
# backend/ on sys.path, so `from app...` resolves under the plain `pytest`
# command too, not only `python -m pytest` (which adds the cwd itself). The
# first GitHub Actions run failed on exactly this; alembic.ini's
# prepend_sys_path = . is the same fix for alembic.
pythonpath = .
env_files = .env.test
env_override_existing_values = 1
filterwarnings =
    ignore::DeprecationWarning
