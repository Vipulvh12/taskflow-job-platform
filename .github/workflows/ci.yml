name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend

    # The same images as docker-compose.yml, published on the ports
    # backend/.env.test expects. The integration tests run against real
    # Postgres, Redis and RabbitMQ, not mocks.
    services:
      postgres:
        image: postgres:16
        # The throwaway test-only credentials from backend/.env.test, in a
        # container that exists only for this job.
        env:
          POSTGRES_USER: taskflow_test
          POSTGRES_PASSWORD: taskflow_test_only
          POSTGRES_DB: taskflow_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U taskflow_test -d taskflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20
      rabbitmq:
        image: rabbitmq:3-management
        ports: ["5672:5672"]
        # check_port_connectivity, not ping: ping passes before the AMQP
        # listener accepts connections (see the README's startup ordering).
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s --health-timeout 10s --health-retries 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"  # the Dockerfile's python:3.11-slim
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Migrations match the models
        # Upgrades an empty database through every migration, then fails if
        # the models describe anything the migrations don't.
        env:
          DATABASE_URL: postgresql://taskflow_test:taskflow_test_only@127.0.0.1:5433/taskflow_migrations
          REDIS_URL: redis://127.0.0.1:6379/0
          RABBITMQ_URL: amqp://guest:guest@127.0.0.1:5672/
          JWT_SECRET: ci-only-not-a-secret-padded-to-32-bytes
        run: |
          python -c "
          import psycopg2
          conn = psycopg2.connect('postgresql://taskflow_test:taskflow_test_only@127.0.0.1:5433/taskflow_test')
          conn.autocommit = True
          conn.cursor().execute('CREATE DATABASE taskflow_migrations')
          "
          alembic upgrade head
          alembic check

      - name: Tests
        run: pytest -q

      - name: Build Docker images
        run: |
          docker build --target api -t taskflow-api:ci .
          docker build --target worker -t taskflow-worker:ci .
